<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داستانِ راز - دلچسپ اور انکھی کہانیاں</title>
    <!-- Firebase SDKs (Compat version for Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: #e0e0e0; line-height: 1.8; }
        
        header { background: #1f1f1f; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 100; }
        .menu-btn { font-size: 24px; background: none; border: none; color: #ff9800; cursor: pointer; }
        header h1 { color: #ff9800; font-size: 22px; cursor: pointer; }

        .sidebar { height: 100%; width: 0; position: fixed; z-index: 200; top: 0; right: 0; background-color: #1a1a1a; overflow-x: hidden; transition: 0.3s; padding-top: 60px; border-left: 2px solid #333; }
        .sidebar a { padding: 12px 25px; text-decoration: none; font-size: 18px; color: #f1f1f1; display: block; transition: 0.2s; border-bottom: 1px solid #2a2a2a; }
        .sidebar a:hover { background: #ff9800; color: #000; }
        .sidebar .close-btn { position: absolute; top: 15px; left: 20px; font-size: 25px; background: none; border: none; color: #fff; cursor: pointer; }

        .container { max-width: 900px; margin: 20px auto; padding: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .card { background: #1e1e1e; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; transition: 0.3s; border: 1px solid #2a2a2a; }
        .card:hover { transform: translateY(-4px); border-color: #ff9800; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-body { padding: 15px; }
        .card-body h3 { color: #ff9800; font-size: 18px; margin-bottom: 5px; }
        .card-body p { color: #aaa; font-size: 14px; }

        /* Loader Animation */
        #loader { text-align: center; padding: 50px; color: #ff9800; font-size: 18px; }
        .spinner { border: 4px solid #222; width: 40px; height: 40px; border-radius: 50%; border-left-color: #ff9800; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #reader-view { display: none; background: #1e1e1e; padding: 25px; border-radius: 8px; border: 1px solid #333; }
        .back-btn { background: #ff9800; color: #000; border: none; padding: 8px 18px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-bottom: 20px; }
        .story-text { white-space: pre-line; font-size: 17px; color: #dcdcdc; text-align: justify; margin-top: 15px; }
        
        .share-box { margin-top: 30px; text-align: center; padding: 15px; background: #252525; border-radius: 6px; }
        .share-btn { background: #25D366; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; }

        /* Custom Toast Notification */
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #222; color: #ff9800; padding: 12px 25px; border-radius: 6px; border: 1px solid #ff9800; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-size: 15px; font-weight: bold; transition: 0.4s ease; z-index: 1000; opacity: 0; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        footer { margin-top: 40px; background: #181818; text-align: center; padding: 25px; border-top: 2px solid #2a2a2a; color: #888; font-size: 14px; }
    </style>
</head>
<body>

    <div id="toast">لنک کاپی ہو گیا!</div>

    <header>
        <button class="menu-btn" onclick="openSidebar()">☰</button>
        <h1 onclick="goHome()" style="cursor: pointer;">داستانِ راز</h1>
        <div style="width: 24px;"></div>
    </header>

    <div id="mySidebar" class="sidebar">
        <button class="close-btn" onclick="closeSidebar()">×</button>
        <a href="#" onclick="filterCategory('All')">📂 تمام کہانیاں</a>
        <a href="#" onclick="filterCategory('Warriors')">⚔️ جنگجو اور سلاطین</a>
        <a href="#" onclick="filterCategory('Mysteries')">🕵️‍♂️ پراسرار راز</a>
        <a href="#" onclick="filterCategory('Legends')">🐉 ڈارک لیجنڈز</a>
        <a href="#" onclick="filterCategory('Romantic')">💖 رومانوی کہانیاں</a>
        <a href="#" onclick="filterCategory('Horror')">👻 خوفناک کہانیاں</a>
        <a href="admin.html" onclick="closeSidebar()">⚙️ ایڈمن پینل</a>
    </div>

    <div class="container">
        
        <div id="loader">
            <div class="spinner"></div>
            داستانیں لوڈ ہو رہی ہیں، براہ کرم انتظار کریں...
        </div>

        <div id="list-view" style="display: none;">
            <h2 id="category-title" style="margin-bottom: 15px; color: #ff9800; font-size: 20px;">حالیہ داستانیں</h2>
            <div class="grid" id="stories-grid"></div>
        </div>

        <div id="reader-view">
            <button class="back-btn" onclick="goHome()">← واپس جائیں</button>
            <div id="reader-content"></div>
            <div class="share-box">
                <p>یہ داستان پسند آئی؟ دوستوں کے ساتھ شیئر کریں!</p>
                <button class="share-btn" onclick="shareStory()">📤 واٹس ایپ پر شیئر کریں</button>
            </div>
        </div>

    </div>

    <footer>
        <p>داستانِ راز - تمام حقوق محفوظ ہیں</p>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCK35nARS_IZoJLv3lupjs9kvxYN1IJWFE",
            authDomain: "dastan-e-raz.firebaseapp.com",
            projectId: "dastan-e-raz",
            storageBucket: "dastan-e-raz.firebasestorage.app",
            messagingSenderId: "282412106108",
            appId: "1:282412106108:web:c49390a188ee743565a4f9",
            measurementId: "G-8YC3S8Q0WJ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allStories = [];
        let currentStoryId = null;

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(() => { toast.className = ""; }, 3000);
        }

        function fetchStories() {
            db.collection("stories").orderBy("createdAt", "desc").get().then((querySnapshot) => {
                allStories = [];
                querySnapshot.forEach((doc) => {
                    allStories.push({ id: doc.id, ...doc.data() });
                });
                
                document.getElementById("loader").style.display = "none";
                document.getElementById("list-view").style.display = "block";

                // Check if URL has a specific story ID to open directly
                const urlParams = new URLSearchParams(window.location.search);
                const storyIdFromUrl = urlParams.get('story');
                if (storyIdFromUrl) {
                    openStory(storyIdFromUrl, false);
                } else {
                    displayStories(allStories);
                }
            }).catch((error) => {
                console.error("Error getting documents: ", error);
                document.getElementById("loader").innerHTML = "<p style='color:red;'>کہانیاں لوڈ کرنے میں مسئلہ پیش آیا ہے۔ پیج ریفریش کریں۔</p>";
            });
        }

        function displayStories(storiesList) {
            const grid = document.getElementById("stories-grid");
            grid.innerHTML = "";
            
            if(storiesList.length === 0) {
                grid.innerHTML = "<p style='color:#888;'>کوئی کہانی موجود نہیں ہے۔ ایڈمن پینل سے کہانی اپ لوڈ کریں۔</p>";
                return;
            }

            storiesList.forEach(story => {
                const card = document.createElement("div");
                card.className = "card";
                card.onclick = () => openStory(story.id, true);
                card.innerHTML = `
                    <img src="${story.image}" alt="Cover">
                    <div class="card-body">
                        <h3>${story.title}</h3>
                        <p>${story.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openSidebar() { document.getElementById("mySidebar").style.width = "250px"; }
        function closeSidebar() { document.getElementById("mySidebar").style.width = "0"; }

        function filterCategory(category) {
            closeSidebar();
            // Clear URL param when switching categories
            if(history.pushState) {
                history.pushState(null, null, window.location.pathname);
            }
            
            if(category === 'All') {
                document.getElementById("category-title").innerText = "حالیہ داستانیں";
                displayStories(allStories);
            } else {
                const filtered = allStories.filter(s => s.category === category);
                const catNames = { 
                    'Warriors': 'جنگجو اور سلاطین', 
                    'Mysteries': 'پراسرار راز', 
                    'Legends': 'ڈارک لیجنڈز',
                    'Romantic': 'رومانوی کہانیاں',
                    'Horror': 'خوفناک کہانیاں'
                };
                document.getElementById("category-title").innerText = "موضوع: " + (catNames[category] || category);
                displayStories(filtered);
            }
        }

        function openStory(id, updateUrl = true) {
            const story = allStories.find(s => s.id === id);
            if(!story) {
                if(updateUrl) showToast("کہانی نہیں ملی!");
                return;
            }

            currentStoryId = id;

            if(updateUrl) {
                const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?story=' + id;
                window.history.pushState({path: newUrl}, '', newUrl);
            }

            // Increment views in database secretly
            db.collection("stories").doc(id).update({
                views: firebase.firestore.FieldValue.increment(1)
            }).catch(err => console.log(err));

            document.getElementById("loader").style.display = "none";
            document.getElementById("list-view").style.display = "none";
            document.getElementById("reader-view").style.display = "block";
            
            document.getElementById("reader-content").innerHTML = `
                <img src="${story.image}" style="width:100%; height:320px; object-fit:cover; border-radius:6px;">
                <h2 style="color:#ff9800; font-size:26px; margin-top:20px;">${story.title}</h2>
                <div class="story-text">${story.content}</div>
            `;
            window.scrollTo(0,0);
        }

        function goHome() {
            currentStoryId = null;
            if(history.pushState) {
                history.pushState(null, null, window.location.pathname);
            }
            document.getElementById("reader-view").style.display = "none";
            document.getElementById("list-view").style.display = "block";
            document.getElementById("category-title").innerText = "حالیہ داستانیں";
            displayStories(allStories);
            window.scrollTo(0,0);
        }

        function shareStory() {
            const shareUrl = window.location.href;
            if (navigator.share) {
                navigator.share({ title: document.title, url: shareUrl }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showToast("کہانی کا خاص لنک کاپی ہو گیا!");
                });
            }
        }

        fetchStories();
    </script>
</body>
</html>
